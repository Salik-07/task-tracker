# Settings shared by every environment.
# ${NAME} is filled in from an environment variable (or from .env in the dev profile).
spring:
  application:
    name: task-tracker

  datasource:
    url: jdbc:postgresql://localhost:${POSTGRES_PORT:5432}/${POSTGRES_DB}
    username: ${POSTGRES_USER}
    password: ${POSTGRES_PASSWORD}

  jpa:
    hibernate:
      # Flyway owns the schema. Hibernate only checks at startup that every entity
      # matches its table, and refuses to start if not. It never creates or alters tables.
      ddl-auto: validate
    # Off: the database session closes when the service's transaction ends, not
    # when the HTTP response is written. Touching a LAZY relation outside a
    # transaction then fails fast (LazyInitializationException) instead of quietly
    # running extra queries from the controller or JSON serializer.
    open-in-view: false
